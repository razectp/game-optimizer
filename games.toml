# Extra game process names (optional). Built-in list covers many titles.

[games]
names = [
  # "MyGame.exe",
]

[settings]
boost_priority = true
disable_power_throttling = true
raise_memory_priority = true
enable_priority_boost = true
prefer_performance_cores = true
residency_floor_percent = 60
# Optional: empty game working sets (may hitch). Also: --trim-game-memory
trim_game_memory = false
# Trim only browsers (Chrome/Edge/Firefox/…) — never ffmpeg or video tools
trim_non_game_memory = false
memory_trim_threshold_mb = 200
max_trim_candidates = 12
# never_trim_names = ["discord"]
# reclaim_names = ["mybrowser"]

# Tunelamento VPS WireGuard (Isolamento por Processo / Anti-Cheat Safe)
[wireguard]
enabled = false
endpoint = ""
private_key = ""
peer_public_key = ""
tunnel_ip = "10.8.0.2"
tunnel_gateway = "10.8.0.1"
dns = "1.1.1.1"
mtu = 1420
keepalive = 25
auto_route_games = true
custom_routes = []
