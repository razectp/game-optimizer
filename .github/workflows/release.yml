name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\installer\package.ps1

      - name: Copy standalone exe
        shell: pwsh
        run: |
          $ver = "0.5.0"
          Copy-Item -LiteralPath "dist\GameOptimizer\game_optimizer.exe" `
            -Destination "dist\GameOptimizer-$ver.exe" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build setup installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          & $iscc ".\installer\GameOptimizer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "iscc failed with exit code $LASTEXITCODE"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Game Optimizer 0.5.0
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/GameOptimizer-0.5.0-setup.exe
            dist/GameOptimizer-0.5.0.exe
            dist/GameOptimizer-0.5.0-windows.zip
          body: |
            Instalador e binário Windows de 64 bits (Windows 10/11).

            **Recomendado:** `GameOptimizer-0.5.0-setup.exe` (assistente Inno Setup, por usuário, sem admin).
            Passos: idioma, boas-vindas, o que será instalado, licença, pasta, atalhos/início com o Windows.

            Instala em `%LOCALAPPDATA%\GameOptimizer`, atalhos, início com o Windows e desinstalação em Aplicativos e recursos.

            **Portátil:** `GameOptimizer-0.5.0.exe` ou o zip com `install.ps1` (o app abre um assistente no primeiro uso).

            ```powershell
            powershell -ExecutionPolicy Bypass -File .\install.ps1
            ```
