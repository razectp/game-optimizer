name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Windows sources
        shell: pwsh
        run: |
          cargo fmt --check --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\installer\package.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build setup installer
        shell: pwsh
        run: |
          $candidates = foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
            foreach ($version in @(7, 6)) { Join-Path $root "Inno Setup $version\ISCC.exe" }
          }
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup.' }
          & $iscc ".\installer\GameOptimizer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "iscc failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/GameOptimizer-*-setup.exe
            dist/GameOptimizer-*-windows.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Linux sources
        run: |
          cargo fmt --check --all
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Validate Linux packaging scripts
        run: |
          bash -n installer/package-linux.sh installer/install-linux.sh
          sh -n installer/linux/tunnel-helper

      - name: Build Linux .deb package
        run: bash installer/package-linux.sh

      - name: Verify clean Linux setup
        run: |
          dpkg-deb -I dist/game-optimizer_*_amd64.deb
          dpkg-deb -c dist/game-optimizer_*_amd64.deb
          min_glibc=$(dpkg-deb --field dist/game-optimizer_*_amd64.deb Depends | grep -oE 'libc6 \(>= [0-9.]+\)' | grep -oE '[0-9.]+')
          test -n "$min_glibc"
          dpkg --compare-versions "$min_glibc" le 2.39
          bash installer/install-linux.sh dist/game-optimizer_*_amd64.deb
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test "$(/usr/bin/game_optimizer --version)" = "game_optimizer $version"
          test -x /usr/lib/game-optimizer/tunnel-helper
          test -f /usr/share/applications/game-optimizer.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/game-optimizer.png
          test -f /usr/share/polkit-1/actions/org.gameoptimizer.tunnel.policy
          test -f /usr/share/polkit-1/rules.d/50-game-optimizer-tunnel.rules

      - name: Stage Linux installer script
        run: install -m 0755 installer/install-linux.sh dist/install-linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            dist/game-optimizer_*_amd64.deb
            dist/install-linux.sh

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify clean Linux setup on ubuntu-latest
        run: |
          bash dist/install-linux.sh dist/game-optimizer_*_amd64.deb
          version=$(dpkg-deb --field dist/game-optimizer_*_amd64.deb Version | cut -d- -f1)
          test "$(/usr/bin/game_optimizer --version)" = "game_optimizer $version"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Game Optimizer ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/GameOptimizer-*-setup.exe
            dist/GameOptimizer-*-windows.zip
            dist/game-optimizer_*_amd64.deb
            dist/install-linux.sh
          body: |
            ## Linux (Ubuntu / Linux Mint / Debian 64 bits)

            **Instalação rápida em sistema Linux limpo:**

            ```bash
            curl -fsSL https://github.com/razectp/game-optimizer/releases/latest/download/install-linux.sh | bash
            ```

            Ou baixe o pacote `game-optimizer_<versão>_amd64.deb` e instale pelo instalador gráfico ou via `bash install-linux.sh ./game-optimizer_<versão>_amd64.deb`. O instalador resolve todas as dependências pelo APT, registra o atalho no menu de aplicativos e configura o Polkit para o túnel WireGuard.

            ---

            ## Windows 10/11 (64 bits)

            **Recomendado:** o arquivo `GameOptimizer-<versão>-setup.exe` (assistente Inno Setup; requer autorização de administrador, mas instala no perfil Windows atual).
            Passos: idioma, boas-vindas, o que será instalado, licença, pasta, atalhos/início com o Windows.

            Instala em `%LOCALAPPDATA%\GameOptimizer`, atalhos, início com o Windows e desinstalação em Aplicativos e recursos. Se forem fornecidas credenciais de outra conta, os dados por usuário podem pertencer a essa conta.
            Se já houver instalação, o assistente mostra atualização e pede para encerrar o app (a janela sozinha só vai para a bandeja).

            **Portátil:** use o ZIP, que inclui `wintun.dll` necessário ao túnel.

            ```powershell
            powershell -ExecutionPolicy Bypass -File .\install.ps1
            ```
