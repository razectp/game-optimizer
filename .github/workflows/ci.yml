name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build and verify distribution payload
        shell: pwsh
        run: |
          & .\installer\package.ps1
          if ($LASTEXITCODE -ne 0) { throw "package.ps1 failed with exit code $LASTEXITCODE" }
          $expected = @('game_optimizer.exe', 'game_optimizer_launcher.exe', 'wintun.dll', 'install.ps1', 'uninstall.ps1', 'icon.ico') | Sort-Object
          $stage = Get-ChildItem 'dist\GameOptimizer' -File | Select-Object -ExpandProperty Name | Sort-Object
          if (Compare-Object $expected $stage) { throw "Staging contents do not match the allowlist: $($stage -join ', ')" }
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $zipPath = "dist\GameOptimizer-$version-windows.zip"
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $entries = @($zip.Entries | ForEach-Object FullName | Sort-Object)
            $expectedEntries = @($expected | ForEach-Object { "GameOptimizer/$_" }) | Sort-Object
            if (Compare-Object $expectedEntries $entries) { throw "ZIP contents do not match allowlist: $($entries -join ', ')" }
            $entry = $zip.GetEntry('GameOptimizer/wintun.dll')
            $stream = $entry.Open()
            try {
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try { $zipHash = [Convert]::ToHexString($sha.ComputeHash($stream)) } finally { $sha.Dispose() }
            } finally { $stream.Dispose() }
            $stageHash = (Get-FileHash 'dist\GameOptimizer\wintun.dll' -Algorithm SHA256).Hash
            if ($zipHash -ne $stageHash) { throw 'ZIP wintun.dll SHA-256 does not match staged DLL.' }
          } finally { $zip.Dispose() }

  verify-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build Linux package
        run: |
          bash -n installer/package-linux.sh installer/install-linux.sh
          sh -n installer/linux/tunnel-helper
          bash installer/package-linux.sh
      - name: Verify clean Linux setup
        run: |
          dpkg-deb -I dist/game-optimizer_*_amd64.deb
          dpkg-deb -c dist/game-optimizer_*_amd64.deb
          min_glibc=$(dpkg-deb --field dist/game-optimizer_*_amd64.deb Depends | grep -oE 'libc6 \(>= [0-9.]+\)' | grep -oE '[0-9.]+')
          test -n "$min_glibc"
          dpkg --compare-versions "$min_glibc" le 2.39
          bash installer/install-linux.sh dist/game-optimizer_*_amd64.deb
          version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          test "$(/usr/bin/game_optimizer --version)" = "game_optimizer $version"
          test -x /usr/lib/game-optimizer/tunnel-helper
          test -f /usr/share/applications/game-optimizer.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/game-optimizer.png
          test -f /usr/share/polkit-1/actions/org.gameoptimizer.tunnel.policy
          test -f /usr/share/polkit-1/rules.d/50-game-optimizer-tunnel.rules
